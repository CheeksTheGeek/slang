name: Rust Dist

# Publishes the sv-lang crates to crates.io via OIDC trusted publishing (no
# token stored), mirroring python-dist.yml. Crates are published in dependency
# order. Runs only on an explicit workflow_dispatch or a published release, and
# the actual publish is gated on the `crates-io` environment.

on:
  workflow_dispatch:
  release:
    types:
      - published

defaults:
  run:
    working-directory: rust

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write   # OIDC token for trusted publishing
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0
    - name: python3 (codegen for verification build)
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.x'
    - name: Authenticate to crates.io (trusted publishing)
      # TODO(maintainer): pin to a verified commit SHA before enabling (repo
      # convention is SHA-pinned actions); left as a version tag because this
      # action is new to the repo and the SHA must be verified, not guessed.
      uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - name: Publish in dependency order
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        set -euo pipefail
        for crate in sv-lang-kinds sv-lang-sys sv-lang-syntax sv-lang sv-lang-db sv-lang-lsp sv-lang-wasm; do
          echo "::group::publish $crate"
          cargo publish -p "$crate"
          echo "::endgroup::"
          # Give the index a moment to make the new version resolvable to the next crate.
          sleep 20
        done
